<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outer and Inner Worlds</title>
    <meta name="description" content="A minimalist and elegant showcase of beautiful illustrations.">
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="showcase-header">
        <h1>Outer and Inner Worlds</h1>
        <p class="subtitle">A collection of works exploring the tension between our external perception and our
            internal experience.</p>
        <div class="color-controls">
            <button id="btn-red" class="color-btn red-btn" aria-label="Activate red filter"></button>
            <button id="btn-blue" class="color-btn blue-btn" aria-label="Activate blue filter"></button>
        </div>
    </header>

    <main class="carousel-container" role="region" aria-roledescription="carousel" aria-label="Illustration Showcase">
        <!-- Navigation Buttons -->
        <button class="nav-arrow left-arrow" id="prev-btn" aria-label="Previous slide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>

        <!-- Carousel Viewport -->
        <div class="carousel-track-viewport" id="carousel-viewport">
            <div class="carousel-track" id="carousel-track">
                <!-- Javascript will populate slides here -->
            </div>
        </div>

        <button class="nav-arrow right-arrow" id="next-btn" aria-label="Next slide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </main>

    <div id="cursor-circle" class="cursor-circle"></div>
    <button id="close-filter-btn" class="close-filter-btn" aria-label="Exit filter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span>Exit Filter</span>
    </button>
    <script src="script.js"></script>
</body>

</html>
